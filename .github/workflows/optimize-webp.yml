name: Optimize WebP assets

on:
  push:
    branches:
      - refactor/services-structure
    paths:
      - 'scripts/optimize-webp.mjs'
      - '.github/workflows/optimize-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/services-structure
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save sharp@0.33.5

      - name: Convert raster assets to WebP and rewrite references
        run: node scripts/optimize-webp.mjs

      - name: Validate production build
        run: npm run build

      - name: Commit optimized assets
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public webp-optimization-report.json
          git commit -m 'Optimize raster assets to WebP'
          git push origin HEAD:refactor/services-structure
