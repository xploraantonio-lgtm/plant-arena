name: Finalize service consumer migration

on:
  push:
    branches:
      - refactor/services-structure

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/services-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply mechanical service replacements
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str, minimum: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrence(s) of {old!r}, found {count}')
              p.write_text(text.replace(old, new))
              print(f'{path}: replaced {count} x {old}')

          def migrate_whole(path: str, service_name: str, service_file: str):
              replace_required(
                  path,
                  "import { SupabaseService } from '../../services/supabaseService'",
                  f"import {{ {service_name} }} from '../../services/{service_file}'",
              )
              replace_required(path, 'SupabaseService.', f'{service_name}.')

          path = 'src/components/Ranking/Ranking.tsx'
          replace_required(
              path,
              "import { SupabaseService } from '../../services/supabaseService'",
              "import { leaderboardService } from '../../services/leaderboardService'\nimport { referralService } from '../../services/referralService'",
          )
          replace_required(path, 'SupabaseService.getGlobalLeaderboard', 'leaderboardService.getGlobalLeaderboard')
          replace_required(path, 'SupabaseService.getUserRank', 'leaderboardService.getUserRank')
          replace_required(path, 'SupabaseService.myReferrals', 'referralService.myReferrals')

          path = 'src/hooks/useInventory.ts'
          replace_required(
              path,
              "import { SupabaseService } from '../services/supabaseService'",
              "import { inventoryService } from '../services/inventoryService'\nimport { profileService } from '../services/profileService'",
          )
          replace_required(path, 'SupabaseService.', 'inventoryService.')
          replace_required(path, 'inventoryService.myBalance', 'profileService.myBalance')

          path = 'src/App.tsx'
          replace_required(
              path,
              "import { SupabaseService } from './services/supabaseService'",
              "import { profileService } from './services/profileService'\nimport { inventoryService } from './services/inventoryService'\nimport { referralService } from './services/referralService'\nimport { seasonService } from './services/seasonService'\nimport { MatchmakingService } from './services/matchmakingService'",
          )
          mapping = {
              'myBalance': 'profileService',
              'referralBind': 'referralService',
              'getActiveSeason': 'seasonService',
              'gameRoomInfo': 'MatchmakingService',
              'getGameRoom': 'MatchmakingService',
              'myInventory': 'inventoryService',
              'saveActiveDeck': 'profileService',
          }
          for method, service in mapping.items():
              replace_required(path, f'SupabaseService.{method}', f'{service}.{method}')

          migrate_whole('src/components/Admin/AdminPanel.tsx', 'adminService', 'adminService')
          migrate_whole('src/components/Marketplace/Marketplace.tsx', 'marketplaceService', 'marketplaceService')
          migrate_whole('src/components/LandingPage/LandingPage.tsx', 'publicService', 'publicService')
          migrate_whole('src/components/Battlefield/Battlefield.tsx', 'battleService', 'battleService')
          migrate_whole('src/components/Lottery/LotteryModal.tsx', 'lotteryService', 'lotteryService')
          migrate_whole('src/components/Shop/Shop.tsx', 'shopService', 'shopService')
          migrate_whole('src/components/ProfileModal/ProfileModal.tsx', 'accountService', 'accountService')

          referral_path = 'src/services/referralService.ts'
          referral_text = Path(referral_path).read_text()
          type_export = "export type { MisReferidos } from './supabaseService'"
          if type_export not in referral_text:
              Path(referral_path).write_text(referral_text + '\n' + type_export + '\n')
          path = 'src/components/Referidos/PanelDeReferidos.tsx'
          replace_required(
              path,
              "import { SupabaseService, type MisReferidos } from '../../services/supabaseService'",
              "import { referralService, type MisReferidos } from '../../services/referralService'",
          )
          replace_required(path, 'SupabaseService.', 'referralService.')

          index = Path('src/services/index.ts')
          text = index.read_text()
          exports = [
              "export { adminService } from './adminService'",
              "export { accountService } from './accountService'",
              "export { publicService } from './publicService'",
              "export { battleService } from './battleService'",
              "export { marketplaceService } from './marketplaceService'",
              "export { lotteryService } from './lotteryService'",
              "export { shopService } from './shopService'",
          ]
          for line in exports:
              if line not in text:
                  text += line + '\n'
          index.write_text(text)

          remaining = []
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.ts', '.tsx'} or 'services' in p.parts:
                  continue
              if '.test.' in p.name or '.spec.' in p.name:
                  continue
              if 'SupabaseService' in p.read_text(errors='ignore'):
                  remaining.append(str(p))
          if remaining:
              raise SystemExit('Remaining direct production consumers:\n' + '\n'.join(remaining))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture diagnostics
        run: |
          set +e
          npm test -- --reporter=verbose > test-output.log 2>&1
          code=$?
          cat test-output.log
          echo "$code" > test-exit-code.txt
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: service-migration-test-output
          path: |
            test-output.log
            test-exit-code.txt
          retention-days: 1

      - name: Enforce no refactor test regressions
        run: |
          if [ "$(cat test-exit-code.txt)" = "0" ]; then
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          import re

          text = Path('test-output.log').read_text(errors='ignore')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)

          known_files = {
              'src/engine/asyncOpponent.test.ts',
              'src/engine/claimAsyncGameRoomsSchema.test.ts',
              'src/engine/matchmakingQueueSchema.test.ts',
              'src/engine/migrationAuditSchema.test.ts',
              'src/engine/rankedStatsUserIdGuard.test.ts',
              'src/engine/rewardCodes.test.ts',
              'src/engine/seasonBeta.test.ts',
              'src/engine/secretCode5Plants.test.ts',
              'src/engine/seedOpponentUsageMetadata.test.ts',
              'src/engine/serverMatchmakingGhostConfig.test.ts',
              'src/engine/winnerInvalidSafety.test.ts',
          }
          failed_files = set(re.findall(r'FAIL\s+.*?(src/[^\s]+\.test\.ts)', text))
          unexpected_files = failed_files - known_files
          if unexpected_files:
              raise SystemExit('Unexpected failing test files: ' + ', '.join(sorted(unexpected_files)))
          if not failed_files:
              raise SystemExit('Tests exited non-zero but no known failure files were parsed')

          blocks = text.split(' FAIL ')[1:]
          if not blocks:
              raise SystemExit('Tests exited non-zero but no failure blocks were parsed')
          bad_blocks = [b.splitlines()[0] for b in blocks if 'ENOENT' not in b or '/supabase/' not in b]
          if bad_blocks:
              raise SystemExit('Found non-baseline test failures: ' + ' | '.join(bad_blocks[:10]))

          if '530 passed' not in text or '78 failed' not in text:
              raise SystemExit('Expected baseline counts (530 passed / 78 failed) changed')

          print('Only the known missing-supabase audit-fixture baseline failed; no refactor regression detected.')
          PY

      - name: Build
        run: npm run build

      - name: Commit validated replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "refactor: finalize service consumer migration"
          git push origin HEAD:refactor/services-structure
