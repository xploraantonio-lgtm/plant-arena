name: Run PvP farming migration

on:
  push:
    branches:
      - refactor/services-structure

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/services-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply migration script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/implement-pvp-farming.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(code, 'apply-pvp-farming.py', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Focused service smoke test
        run: npx vitest run src/services/domainServices.test.ts

      - name: Diff validation
        run: git diff --check

      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public supabase
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "feat: add server-authoritative PvP farming drops [pvp-migration]"
          git push origin HEAD:refactor/services-structure
