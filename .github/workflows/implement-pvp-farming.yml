          text = replace_once(text, "        {/* ACTIVE BATTLE DECK (3 TO 6 SLOTS) */}", resources, 'Jardin farming section')
          write(p, text)

          p = 'src/components/Jardin/Jardin.css'
          text = read(p)
          text += r'''

